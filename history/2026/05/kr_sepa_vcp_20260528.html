<!DOCTYPE html><html lang="ko"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>국장 SEPA + VCP 돌파 후보 | 2026-06-03</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
:root{
  --bg:#1a2540;
  --bg-gradient:linear-gradient(180deg,#1a2540 0%,#0f1828 100%);
  --card-bg:#f5f1ea;
  --card-bg-hover:#f9f5ee;
  --border:#2c3a5a;
  --text:#1a2540;
  --text-light:#475569;
  --muted:#94a3b8;
  --teal:#14b8a6;
  --teal-light:#5eead4;
  --teal-bg:#e0f7f4;
  --teal-bg-dark:rgba(20,184,166,0.15);
  --green:#10b981;
  --green-bg:#d1fae5;
  --red:#ef4444;
  --red-bg:#fee2e2;
  --yellow:#f59e0b;
  --yellow-bg:#fef3c7;
  --purple:#8b5cf6;
}
html,body{background:var(--bg);background:var(--bg-gradient);min-height:100vh;}
body{
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Apple SD Gothic Neo','Noto Sans KR',sans-serif;
  font-size:14px;line-height:1.6;padding:20px 14px;
  max-width:760px;margin:0 auto;
}

/* ============ 헤더 ============ */
.page-header{
  background:linear-gradient(135deg,rgba(20,184,166,0.15),rgba(20,184,166,0.05));
  border:1px solid var(--teal);border-radius:18px;
  padding:24px 22px;margin-bottom:24px;
  color:#fff;text-align:center;
  position:relative;
}
.page-header h1{
  font-size:1.4rem;color:#fff;margin-bottom:6px;font-weight:700;
}
.page-header .subtitle{color:var(--teal-light);font-size:0.85rem;}

.summary-bar{
  display:grid;grid-template-columns:repeat(auto-fit,minmax(95px,1fr));gap:8px;
  margin-top:16px;
}
.stat-box{
  background:rgba(255,255,255,0.08);border:1px solid var(--teal);border-radius:10px;
  padding:10px 8px;text-align:center;
}
.stat-box .num{font-size:1.3rem;font-weight:700;color:var(--teal-light);}
.stat-box .label{color:#cbd5e1;font-size:0.7rem;margin-top:2px;text-transform:uppercase;letter-spacing:0.5px;}

/* 섹터 탭 (상단 필터) */
.sector-tabs{
  display:flex;flex-wrap:wrap;gap:6px;margin-top:14px;justify-content:center;
}
.sector-tab{
  background:rgba(255,255,255,0.06);
  border:1px solid rgba(20,184,166,0.4);
  border-radius:999px;
  padding:6px 12px;
  font-size:0.78rem;font-weight:600;color:#cbd5e1;
  cursor:pointer;user-select:none;
  transition:background 0.15s,border-color 0.15s,color 0.15s;
  display:inline-flex;align-items:center;gap:6px;
}
.sector-tab:hover{background:rgba(20,184,166,0.15);color:#fff;}
.sector-tab.active{
  background:var(--teal);border-color:var(--teal);color:#fff;
  box-shadow:0 2px 8px rgba(20,184,166,0.4);
}
.sector-tab .count{
  background:rgba(0,0,0,0.25);border-radius:999px;
  padding:1px 7px;font-size:0.72rem;font-weight:700;
}
.sector-tab.active .count{background:rgba(255,255,255,0.25);}

/* ============ 카드 ============ */
.card{
  background:var(--card-bg);border-radius:14px;
  padding:20px 18px;margin-bottom:14px;
  box-shadow:0 4px 16px rgba(0,0,0,0.25);
  border:1px solid rgba(255,255,255,0.05);
}

/* 카드 헤더: 가격 블록을 우측 상단에 absolute 고정, 좌측 컨텐츠에 마진 패딩으로 영역 확보 */
.card{position:relative;}
.card-top{display:block;padding-right:130px;min-height:60px;}
.card-top-left{display:block;}
.ticker-row{display:flex;align-items:center;gap:10px;margin-bottom:6px;flex-wrap:wrap;}
.ticker-pill{
  background:var(--teal);color:#fff;border-radius:10px;
  padding:6px 12px;font-weight:800;font-size:1.05rem;letter-spacing:0.5px;flex-shrink:0;
}
.company-name{
  font-size:1.02rem;font-weight:700;color:var(--text);
  word-break:keep-all;overflow-wrap:anywhere;line-height:1.3;
}
.tagline{
  background:var(--teal-bg);color:var(--teal);
  border:1px solid var(--teal);border-radius:12px;
  padding:3px 9px;font-size:0.72rem;font-weight:600;display:inline-block;margin-top:4px;
  max-width:calc(100% - 4px);word-break:keep-all;
}
.sub-headline{color:var(--text-light);font-size:0.82rem;line-height:1.45;margin-top:6px;
  word-break:keep-all;overflow-wrap:anywhere;}

/* 가격 블록: 카드 우측 상단 absolute 고정 - 어떤 너비에서도 항상 이 자리 */
.price-block{
  position:absolute;top:20px;right:18px;
  text-align:right;
  width:auto;max-width:130px;
}
.price-block .price-row{display:flex;align-items:baseline;justify-content:flex-end;gap:6px;flex-wrap:wrap;row-gap:2px;}
.price-block .price{white-space:nowrap;}
.price-block .price{font-size:1.5rem;font-weight:800;color:var(--text);}
.price-block .day-chg{
  font-size:0.78rem;font-weight:700;
  padding:2px 7px;border-radius:6px;
  white-space:nowrap;
}
/* 한국 관습: 상승=빨강, 하락=파랑 */
.price-block .day-chg.up{color:var(--red);background:var(--red-bg);}
.price-block .day-chg.down{color:#2563eb;background:#dbeafe;}
.price-block .day-chg.flat{color:var(--muted);background:rgba(148,163,184,0.15);}
.price-block .rank-display{font-size:0.72rem;font-weight:700;color:var(--text-light);margin-top:4px;text-align:right;white-space:nowrap;}
.price-block .rank-display .prev-rank{color:var(--muted);font-size:0.68rem;font-weight:400;}

/* 등급 라인 */
.grade-line{
  display:flex;flex-wrap:wrap;gap:14px;align-items:center;
  padding:10px 0;margin-top:8px;border-top:1px dashed #d6d0c4;border-bottom:1px dashed #d6d0c4;
  font-size:0.78rem;
}
.grade{display:inline-flex;align-items:center;gap:5px;color:var(--text-light);font-weight:600;}
.grade .dot{width:6px;height:6px;border-radius:50%;background:var(--teal);}
.grade.warn .dot{background:var(--yellow);}
.grade.fail .dot{background:var(--red);}
.grade .value{color:var(--text);font-weight:700;}

/* 실적 박스 2x2 */
.metrics-2x2{
  display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px;
}
.metric-box{
  background:rgba(255,255,255,0.5);border:1px solid #e1ddd2;border-radius:10px;
  padding:11px 13px;
}
.metric-box .label{color:var(--teal);font-size:0.7rem;font-weight:700;text-transform:uppercase;letter-spacing:0.5px;}
.metric-box .value{font-size:1.05rem;font-weight:800;color:var(--text);margin-top:4px;}
.metric-box .sub{font-size:0.72rem;color:var(--text-light);margin-top:2px;}
.metric-box .sub.up{color:var(--green);font-weight:600;}
.metric-box .sub.down{color:var(--red);font-weight:600;}

/* 섹션 (기업개요·투자근거·리스크·카탈리스트) */
.section{margin-top:16px;}
.section-title{
  display:flex;align-items:center;gap:6px;
  font-size:0.82rem;font-weight:700;color:var(--text);
  padding-left:8px;border-left:3px solid var(--teal);
  margin-bottom:8px;
}
.section-body{font-size:0.85rem;color:var(--text-light);line-height:1.6;}

/* 투자 근거 (번호 매긴 리스트) */
.thesis-list{display:flex;flex-direction:column;gap:8px;}
.thesis-item{display:flex;gap:10px;align-items:flex-start;}
.thesis-num{
  background:var(--teal);color:#fff;
  width:22px;height:22px;border-radius:6px;
  display:flex;align-items:center;justify-content:center;
  font-size:0.78rem;font-weight:700;flex-shrink:0;margin-top:2px;
}
.thesis-text{flex:1;font-size:0.85rem;}
.thesis-text .title{font-weight:700;color:var(--text);}
.thesis-text .body{color:var(--text-light);margin-top:2px;}

/* 리스크 */
.risk-list{display:flex;flex-direction:column;gap:6px;}
.risk-item{display:flex;gap:8px;align-items:flex-start;font-size:0.82rem;color:var(--text-light);}
.risk-icon{color:var(--yellow);flex-shrink:0;}

/* 카탈리스트 */
.catalyst-box{
  background:linear-gradient(135deg,var(--teal-bg),rgba(20,184,166,0.05));
  border:1px solid var(--teal);border-radius:10px;
  padding:12px 14px;margin-top:14px;
}
.catalyst-title{display:flex;align-items:center;gap:6px;font-weight:700;color:var(--teal);font-size:0.82rem;margin-bottom:6px;}
.catalyst-list{display:flex;flex-direction:column;gap:4px;font-size:0.8rem;color:var(--text-light);}
.catalyst-item{display:flex;gap:6px;align-items:flex-start;}
.catalyst-item::before{content:"•";color:var(--teal);font-weight:700;flex-shrink:0;}

/* 진입/손절 박스 */
.entry-stop-row{
  display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px;
}
.entry-pill, .stop-pill{
  border-radius:10px;padding:10px 14px;text-align:center;
  border:1px solid;
}
.entry-pill{background:var(--green-bg);border-color:var(--green);}
.entry-pill .label{color:var(--green);font-size:0.72rem;font-weight:700;display:flex;align-items:center;justify-content:center;gap:5px;}
.entry-pill .value{color:var(--text);font-size:0.92rem;font-weight:700;margin-top:3px;}
.stop-pill{background:var(--red-bg);border-color:var(--red);}
.stop-pill .label{color:var(--red);font-size:0.72rem;font-weight:700;display:flex;align-items:center;justify-content:center;gap:5px;}
.stop-pill .value{color:var(--text);font-size:0.92rem;font-weight:700;margin-top:3px;}

/* 푸터 */
.footer{
  text-align:center;color:#94a3b8;font-size:0.78rem;padding:24px;
  border-top:1px solid var(--border);margin-top:32px;
}

@media(max-width:540px){
  body{padding:14px 10px;}
  .card{padding:16px 14px;}
  .card-top{padding-right:110px;}
  .ticker-pill{font-size:0.88rem;padding:5px 9px;}
  .company-name{font-size:0.88rem;}
  .price-block{top:16px;right:14px;max-width:110px;}
  .price-block .price{font-size:1.1rem;}
  .price-block .day-chg{font-size:0.7rem;padding:2px 5px;}
  .price-block .change{font-size:0.7rem;}
  .price-block .vol{font-size:0.62rem;}
  .metrics-2x2{grid-template-columns:1fr;}
  .grade-line{gap:10px;font-size:0.72rem;}
}

/* 아주 좁은 화면 (소형 폰): 가격 블록 더 잔게 · 프릴을 좌측 완전 분리 */
@media(max-width:420px){
  .card-top{padding-right:96px;}
  .price-block{top:16px;right:14px;max-width:96px;}
  .price-block .price{font-size:1rem;}
  .price-block .day-chg{font-size:0.65rem;padding:1px 4px;}
  .price-block .change{font-size:0.68rem;}
  .price-block .vol{font-size:0.6rem;}
  .ticker-pill{font-size:0.82rem;padding:4px 8px;}
  .company-name{font-size:0.85rem;}
}
</style>
</head>
<body>
<div class="page-header">
  <h1>📊 국장 SEPA + VCP 돌파 후보</h1>
  <div class="subtitle">2026년 05월 28일 (목) 종가 기준</div>
  <div class="sector-tabs"><button class="sector-tab active" data-filter="all">전체 <span class="count">0</span></button></div>
</div>



<script>
(function(){
  var tabs = document.querySelectorAll('.sector-tab');
  var cards = document.querySelectorAll('.card[data-sector]');
  tabs.forEach(function(tab){
    tab.addEventListener('click', function(){
      tabs.forEach(function(t){ t.classList.remove('active'); });
      tab.classList.add('active');
      var f = tab.getAttribute('data-filter');
      cards.forEach(function(c){
        var show = (f === 'all') ||
                   (f === 'ai' && c.getAttribute('data-ai') === 'true') ||
                   (f !== 'ai' && c.getAttribute('data-sector') === f);
        c.style.display = show ? '' : 'none';
      });
    });
  });
})();
</script>


<div class="footer">
  <p>MacTrader v5 · Minervini SEPA + VCP 돌파매매</p>
  <p>🦞 뭉 (Mung) · Mac Mini M4 · 자동 생성</p>
  <p>📊 데이터: yfinance · Finnhub · dalinaum · Naver금융 · 🧠 심층분석: Claude Sonnet</p>
</div>
</body></html>

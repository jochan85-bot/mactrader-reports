<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MacTrader 리포트</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#0d1117;color:#e6edf3;padding:16px;max-width:640px;margin:0 auto}
.header{display:flex;align-items:center;justify-content:space-between;margin:20px 0 4px}
h1{color:#58a6ff;font-size:22px}
.guide-btn{font-size:12px;color:#8b949e;border:1px solid #30363d;border-radius:6px;padding:4px 10px;text-decoration:none;white-space:nowrap}
.guide-btn:hover{color:#e6edf3;border-color:#58a6ff}
.tagline{color:#8b949e;font-size:13px;margin-bottom:12px}
.breakout-banner{display:flex;align-items:center;justify-content:space-between;background:#161b22;border:1px solid #30363d;border-left:3px solid #58a6ff;border-radius:8px;padding:11px 14px;text-decoration:none;margin-bottom:20px}
.breakout-banner:active{border-color:#58a6ff}
.breakout-banner .bb-left{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600;color:#e6edf3}
.breakout-banner .bb-sub{font-size:11.5px;color:#8b949e;margin-top:1px}
.breakout-banner .bb-arrow{color:#58a6ff;font-size:16px}
.section{margin-bottom:24px}
.section-title{color:#8b949e;font-size:11px;text-transform:uppercase;letter-spacing:1.5px;margin-bottom:10px;padding-bottom:6px;border-bottom:1px solid #21262d}
.card{display:block;background:#161b22;border:1px solid #30363d;color:#e6edf3;padding:14px 16px;border-radius:8px;text-decoration:none;margin:6px 0;font-size:15px}
.card:active{border-color:#58a6ff}
.card-history{font-size:16px;font-weight:600;padding:18px 20px}
.card-top{display:flex;align-items:center;justify-content:space-between}
.card-left{display:flex;align-items:center;gap:10px}
.icon{font-size:18px}
.card-date{font-size:12px;color:#58a6ff;font-weight:600;white-space:nowrap}
.desc{display:block;font-size:12px;color:#8b949e;margin-top:4px}
.arrow{float:right;color:#58a6ff;font-size:18px;line-height:1.2}
</style>
</head>
<body>
<div class="header">
  <h1>📈 MacTrader</h1>
  <a class="guide-btn" href="guide.html">리포트 Guide</a>
</div>
<p class="tagline">일일 투자 분석 · Minervini SEPA + VCP</p>
<a class="breakout-banner" href="breakout.html">
  <div>
    <div class="bb-left">🚀 돌파매매란?</div>
    <div class="bb-sub">Minervini 방법론 · SEPA + VCP 완전 가이드</div>
  </div>
  <span class="bb-arrow">›</span>
</a>

<div class="section">
  <div class="section-title">📅 최신 리포트</div>

  <a class="card" href="sepa_vcp_latest.html">
    <div class="card-top">
      <div class="card-left">
        <span class="icon">🎯</span>
        <span>미장 리포트</span>
      </div>
      <span class="card-date" id="us-date">2026. 07.02 (목)</span>
    </div>
  </a>

  <a class="card" href="kr_sepa_vcp_latest.html">
    <div class="card-top">
      <div class="card-left">
        <span class="icon">🇰🇷</span>
        <span>국장 리포트</span>
      </div>
      <span class="card-date" id="kr-date">2026. 07.03 (금)</span>
    </div>
  </a>
</div>

<div class="section">
  <div class="section-title">🗂️ 히스토리</div>
  <a class="card card-history" href="history/index.html">
    <span class="icon">📁</span>히스토리
    <span class="arrow">›</span>
    <span class="desc">년도 / 월별 리포트 모음</span>
  </a>
</div>

</body>
</html>

<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MacTrader 리포트</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#0d1117;color:#e6edf3;padding:16px;max-width:640px;margin:0 auto}
.header{display:flex;align-items:center;justify-content:space-between;margin:20px 0 20px}
h1{color:#58a6ff;font-size:22px}
.guide-btn{font-size:12px;color:#8b949e;border:1px solid #30363d;border-radius:6px;padding:4px 10px;text-decoration:none;white-space:nowrap}
.guide-btn:hover{color:#e6edf3;border-color:#58a6ff}
.btn-col{display:flex;flex-direction:column;gap:5px;align-items:stretch}
.guide-btn{text-align:center}
.section{margin-bottom:24px}
.section-title{color:#8b949e;font-size:11px;text-transform:uppercase;letter-spacing:1.5px;margin-bottom:10px;padding-bottom:6px;border-bottom:1px solid #21262d}
.card{display:block;background:#161b22;border:1px solid #30363d;color:#e6edf3;padding:14px 16px;border-radius:8px;text-decoration:none;margin:6px 0;font-size:15px}
.card:active{border-color:#58a6ff}
.card-history{font-size:16px;font-weight:600;padding:18px 20px}
.card-top{display:flex;align-items:center;justify-content:space-between}
.card-left{display:flex;align-items:center;gap:10px}
.icon{font-size:18px}
.card-date{font-size:12px;color:#58a6ff;font-weight:600;white-space:nowrap}
.desc{display:block;font-size:12px;color:#8b949e;margin-top:4px}
.arrow{float:right;color:#58a6ff;font-size:18px;line-height:1.2}
</style>
</head>
<body>
<div class="header">
  <h1>📈 MacTrader</h1>
  <div class="btn-col">
    <a class="guide-btn" href="breakout.html">돌파매매란?</a>
    <a class="guide-btn" href="guide.html">리포트 Guide</a>
    <a class="guide-btn" href="stop_loss_calculator.html">Stop 계산기</a>
    <a class="guide-btn" href="stage_reader.html">Stage 판독기</a>
  </div>
</div>

<div class="section">
  <div class="section-title">📅 최신 리포트</div>

  <a class="card" href="sepa_vcp_latest.html">

      </div>

      <div class="card-left">
        <span class="icon">🇰🇷</span>
        <span>국장 리포트</span>
      </div>
      <span class="card-date" id="kr-date">2026. 08.18 (화)</span>
    </div>
  </a>
</div>

<div class="section">
  <div class="section-title">🗂️ 히스토리</div>
  <a class="card card-history" href="history/index.html">
    <span class="icon">📁</span>히스토리
    <span class="arrow">›</span>
    <span class="desc">년도 / 월별 리포트 모음</span>
  </a>
</div>

</html>

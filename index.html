<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MacTrader 리포트</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#0d1117;color:#e6edf3;padding:20px;max-width:640px;margin:0 auto}
h1{color:#58a6ff;font-size:22px;margin:20px 0 4px}
.tagline{color:#8b949e;font-size:13px;margin-bottom:28px}
.section{margin-bottom:28px}
.section-title{color:#8b949e;font-size:11px;text-transform:uppercase;letter-spacing:1.5px;margin-bottom:10px;padding-bottom:6px;border-bottom:1px solid #21262d}
.card{display:block;background:#161b22;border:1px solid #30363d;color:#e6edf3;padding:14px 16px;border-radius:8px;text-decoration:none;margin:6px 0;font-size:15px;transition:border-color .2s}
.card:hover{border-color:#58a6ff;color:#58a6ff}
.card .icon{margin-right:10px;font-size:18px}
.card .desc{display:block;font-size:12px;color:#8b949e;margin-top:3px}
.date-group{margin-bottom:20px}
.date-label{font-size:14px;color:#e6edf3;font-weight:600;margin-bottom:8px;display:flex;align-items:center;gap:8px}
.badge{background:#1f6feb;color:#fff;font-size:10px;padding:2px 8px;border-radius:10px}
.badge-kr{background:#2d4a1e;color:#7ee787}
.empty{color:#8b949e;font-size:13px;padding:12px 0}
</style>
</head>
<body>
<h1>📈 MacTrader</h1>
<p class="tagline">IBD RS 기반 일일 투자 분석 · Minervini SEPA + VCP</p>

<div class="section">
  <div class="section-title">📅 최신 리포트</div>
  <div id="latest"><p class="empty">로딩 중...</p></div>
</div>

<div class="section">
  <div class="section-title">🗂️ 히스토리 (후행분석용)</div>
  <div id="history"><p class="empty">로딩 중...</p></div>
</div>

<script>
fetch('reports_manifest.json?t=' + Date.now())
  .then(r => r.json())
  .then(reports => {
    const sorted = [...reports].sort((a,b) => b.date.localeCompare(a.date));

    function renderGroup(r, isLatest) {
      return `<div class="date-group">
        <div class="date-label">
          ${r.label}
          ${isLatest ? '<span class="badge">최신</span>' : ''}
        </div>
        ${r.files.map(f => `
          <a class="card" href="${f.url}">
            <span class="icon">${f.icon}</span>${f.title}
            <span class="desc">${f.desc}</span>
          </a>`).join('')}
      </div>`;
    }

    document.getElementById('latest').innerHTML = renderGroup(sorted[0], true);

    if (sorted.length > 1) {
      document.getElementById('history').innerHTML = sorted.slice(1).map(r => renderGroup(r, false)).join('');
    } else {
      document.getElementById('history').innerHTML = '<p class="empty">내일부터 히스토리가 쌓여요 📚</p>';
    }
  })
  .catch(() => {
    document.getElementById('latest').innerHTML = '<p class="empty">리포트를 불러올 수 없어요.</p>';
  });
</script>
</body>
</html>

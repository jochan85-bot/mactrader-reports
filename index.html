<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>뭉치 트레이더 리포트</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#0d1117;color:#e6edf3;padding:16px;max-width:640px;margin:0 auto}
.header{display:block;margin:20px 0 20px}
h1{color:#58a6ff;font-size:22px;display:flex;align-items:center;gap:9px;line-height:1.2}
.avatar{width:36px;height:36px;border-radius:50%;object-fit:cover;border:1px solid #30363d;flex-shrink:0;display:block}
.guide-btn{font-size:12px;color:#8b949e;border:1px solid #30363d;border-radius:6px;padding:4px 10px;text-decoration:none;white-space:nowrap}
.guide-btn:hover{color:#e6edf3;border-color:#58a6ff}
.btn-col{display:flex;flex-direction:row;flex-wrap:nowrap;gap:6px;margin-top:12px}
.guide-btn{flex:1 1 0;padding:6px 2px;font-size:11px;white-space:nowrap;text-align:center}
.section{margin-bottom:24px}
.section-title{color:#8b949e;font-size:11px;text-transform:uppercase;letter-spacing:1.5px;margin-bottom:10px;padding-bottom:6px;border-bottom:1px solid #21262d}
.card{display:block;background:#161b22;border:1px solid #30363d;color:#e6edf3;padding:14px 16px;border-radius:8px;text-decoration:none;margin:6px 0;font-size:15px}
.card:active{border-color:#58a6ff}
.card-history{font-size:16px;font-weight:600;padding:18px 20px}
/* [INDEX-SLIM-20260910] 히스토리 박스 — 한 줄 제목만, 세로 얇게 (모바일 한 화면) */
.card-slim{padding:8px 16px;font-size:13px;color:#8b949e}
.card-slim .icon{font-size:14px;margin-right:8px}
.card-slim .arrow{font-size:14px}
.card-top{display:flex;align-items:center;justify-content:space-between}
.card-left{display:flex;align-items:center;gap:10px}
.icon{font-size:18px}
.card-date{font-size:12px;color:#58a6ff;font-weight:600;white-space:nowrap}
.desc{display:block;font-size:12px;color:#8b949e;margin-top:4px}
.arrow{float:right;color:#58a6ff;font-size:18px;line-height:1.2}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid2 .card{margin:0}
.sig-ico{width:20px;height:20px;flex-shrink:0;display:block}
/* --- 시장경보 정사각 박스 (초안 v2) --- */
.report-row{display:flex;align-items:stretch;gap:8px;margin:6px 0}
.report-row .card{flex:1 1 auto;min-width:0;margin:0}
.bear-sq{flex:0 0 60px;width:60px;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:6px;
  background:#161b22;border:1px solid #30363d;border-radius:8px;
  color:#8b949e;text-decoration:none}
.bear-sq:active{border-color:#58a6ff}
.bear-sq .dot{width:14px;height:14px;border-radius:50%;background:#484f58}
.bear-sq .lv{font-size:11.5px;font-weight:700;letter-spacing:.2px}
.bear-sq .dot{transition:background .2s}
.rg-mini{display:flex;flex-direction:column;gap:1.5px;width:16px}
.rg-mini i{display:block;height:4px;border-radius:1px;background:#30363d;transition:background .2s}
.rg-stale{display:none;font-size:8.5px;color:#e3b341;line-height:1.2;text-align:center;white-space:nowrap;margin-top:2px}
</style>
</head>
<body>
<div class="header">
  <h1><img class="avatar" src="assets/mungchi.jpg" alt="뭉치" width="36" height="36">뭉치 트레이더 리포트</h1>
  <div class="btn-col">
    <a class="guide-btn" href="breakout.html">돌파매매란?</a>
    <a class="guide-btn" href="guide.html">리포트 Guide</a>
    <a class="guide-btn" href="stop_loss_calculator.html">Stop 계산기</a>
    <a class="guide-btn" href="stage_reader.html">Stage 판독기</a>
  </div>

<div class="section">
  <div class="section-title">📅 최신 리포트</div>

  <div class="report-row">
    <a class="card" href="sepa_vcp_latest.html">
      <div class="card-top">

          <span class="icon">🎯</span>
          <span>미장 리포트</span>

    <!--RG_us-regime_BEGIN--><a class="bear-sq" id="us-regime" href="regime_us.html" aria-label="미장 진입 경보"><span class="rg-mini"></span><span class="rg-stale"></span></a><!--RG_us-regime_END-->
  </div>

  <div class="report-row">
    <a class="card" href="kr_sepa_vcp_latest.html">
      <div class="card-top">
        <div class="card-left">
          <span class="icon">🇰🇷</span>
          <span>국장 리포트</span>
        </div>
        <span class="card-date" id="kr-date">2026. 09.22 (화)</span>
      </div>
    </a>
    <!--RG_kr-regime_BEGIN--><a class="bear-sq" id="kr-regime" href="regime_kr.html" aria-label="국장 진입 경보"><span class="rg-mini"></span><span class="rg-stale"></span></a><!--RG_kr-regime_END-->
  </div>

  <a class="card card-slim" href="history/index.html">
    <span class="icon">📁</span>리포트 히스토리

      <div class="card-left">

<div class="section">
  <div class="section-title">📡 시그널 시스템</div>
  <div class="grid2">
    <a class="card" href="https://jochan85-bot.github.io/crypto-reports/">
      <div class="card-left">
        <svg class="sig-ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="11" fill="#f7931a"/><text x="12" y="17.4" font-size="15" font-weight="700" fill="#fff" text-anchor="middle" font-family="Helvetica,Arial">₿</text></svg>
        <span>가상화폐 신호</span>
      </div>

    <a class="card" href="https://jochan85-bot.github.io/gold-reports/">
      <div class="card-left">
        <svg class="sig-ico" viewBox="0 0 24 24" aria-hidden="true"><defs><linearGradient id="goldg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe08a"/><stop offset="1" stop-color="#d4a017"/></linearGradient></defs><path d="M4 17h16l-2.2-5.4H6.2z" fill="url(#goldg)" stroke="#a97b0d" stroke-width="0.7"/><path d="M6.6 10.6h10.8L15.6 6H8.4z" fill="url(#goldg)" stroke="#a97b0d" stroke-width="0.7"/></svg>
        <span>금 신호</span>

  </div>
</div>
<!--RG_JS_BEGIN-->
<script>
(function(){
  var ST={0:{c:'#4FC3F7',n:'정상'},1:{c:'#8BC34A',n:'주의'},2:{c:'#FFD600',n:'경계'},
          3:{c:'#FF6D00',n:'위험'},4:{c:'#D50000',n:'차단'}};
  function miniHTML(s){
    var h='';
    for(var i=4;i>=0;i--){ var on=i<=s; h+='<i style="background:'+(on?ST[i].c:'#30363d')+'"></i>'; }
    return h;
  }
  fetch('regime_latest.json?v=' + Date.now(), {cache: 'no-store'}).then(function(r){
    if(!r.ok) throw new Error(r.status);
    return r.json();
  }).then(function(j){
    [['us-regime','US'],['kr-regime','KR']].forEach(function(p){
      var el=document.getElementById(p[0]), d=j[p[1]];
      if(!el||!d||!ST[d.state]) return;
      var st=ST[d.state], cap=(d.cap===0?'차단':Math.round(d.cap*100)+'%');
      el.querySelector('.rg-mini').innerHTML=miniHTML(d.state);
      el.setAttribute('aria-label', el.getAttribute('aria-label')+' — 확정 상태 '+d.state+'/4 '+st.n+', 오늘 raw '+d.raw+', 노출 상한 '+cap);
      el.setAttribute('title','확정 '+d.state+'/4 '+st.n+' · 오늘 raw '+d.raw+' · 노출 상한 '+cap+' · '+d.date);
      if(d.stale){
        el.style.opacity='0.55';
        var se=el.querySelector('.rg-stale');
        if(se){ se.textContent=d.date.slice(5)+' 기준'; se.style.display='block'; }
        el.setAttribute('title', el.getAttribute('title')+' · ⚠️ 갱신 지연(스테일)');
      }
    });
  }).catch(function(){});
})();
</script>
<!--RG_JS_END-->
</body>
</html>

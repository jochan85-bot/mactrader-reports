<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MacTrader 리포트</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#0d1117;color:#e6edf3;padding:16px;max-width:640px;margin:0 auto}
h1{color:#58a6ff;font-size:22px;margin:20px 0 4px}
.tagline{color:#8b949e;font-size:13px;margin-bottom:24px}
.section{margin-bottom:24px}
.section-title{color:#8b949e;font-size:11px;text-transform:uppercase;letter-spacing:1.5px;margin-bottom:10px;padding-bottom:6px;border-bottom:1px solid #21262d}
.card{display:block;background:#161b22;border:1px solid #30363d;color:#e6edf3;padding:14px 16px;border-radius:8px;text-decoration:none;margin:6px 0;font-size:15px}
.card:active{border-color:#58a6ff}
.card-history{font-size:16px;font-weight:600;padding:18px 20px}
.icon{margin-right:10px;font-size:18px}
.desc{display:block;font-size:12px;color:#8b949e;margin-top:3px}
.date-group{margin-bottom:20px}
.date-label{font-size:14px;font-weight:600;margin-bottom:8px;display:flex;align-items:center;gap:8px}
.badge{background:#1f6feb;color:#fff;font-size:10px;padding:2px 8px;border-radius:10px}
.arrow{float:right;color:#58a6ff;font-size:18px;line-height:1.2}
</style>
</head>
<body>
<h1>📈 MacTrader</h1>
<p class="tagline">IBD RS 기반 일일 투자 분석 · Minervini SEPA + VCP</p>

<div class="section">
  <div class="section-title">📅 최신 리포트</div>
  <div id="latest"></div>
</div>

<div class="section">
  <div class="section-title">🗂️ 히스토리</div>
  <a class="card card-history" href="history/index.html">
    <span class="icon">📁</span>히스토리
    <span class="arrow">›</span>
    <span class="desc">년도 / 월별 리포트 모음</span>
  </a>
</div>

<script>
const LATEST = {
  date: "2026-05-31",
  label: "2026년 05월 31일 (Sun) — 미장 자동 생성 (상세)",
  files: [
    { icon: "🎯", title: "미장 SEPA+VCP", desc: "Minervini 돌파 후보 + 실적/애널리스트/뉴스", url: "history/2026/05/sepa_vcp_20260531.html" },
    { icon: "🤖", title: "미장 AI 관련", desc: "오늘 IBD 리스트 중 AI 연관 종목", url: "history/2026/05/ai_sector_20260531.html" },
    { icon: "🇰🇷", title: "국장 SEPA+VCP", desc: "한국 돌파 후보 + 분기 실적/외국인 비율/뉴스", url: "history/2026/05/kr_sepa_vcp_20260530.html" }
  ]
};

document.getElementById('latest').innerHTML = `
  <div class="date-group">
    <div class="date-label">${LATEST.label} <span class="badge">최신</span></div>
    ${LATEST.files.map(f=>`
      <a class="card" href="${f.url}">
        <span class="icon">${f.icon}</span>${f.title}
        <span class="desc">${f.desc}</span>
      </a>`).join('')}
  </div>`;
</script>
</body>
</html>
